schemaVersion: "1"
kind: agent
name: vibe
displayName: Mistral Vibe
description: Run Mistral Vibe, the Mistral CLI coding agent, in a Docker Sandbox with MISTRAL_API_KEY injected via the host proxy.

agent:
  image: "docker/sandbox-templates:shell-docker"
  entrypoint:
    run:
      - vibe

environment:
  variables:
    PATH: "/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  proxyManaged:
    - MISTRAL_API_KEY

credentials:
  sources:
    mistral:
      env:
        - MISTRAL_API_KEY

network:
  allowedDomains:
    - "mistral.ai"
    - "*.mistral.ai"
    - "*.mistral.services"
    - "astral.sh"
    - "*.astral.sh"
    - "pypi.org"
    - "*.pypi.org"
    - "files.pythonhosted.org"
    - "github.com"
    - "raw.githubusercontent.com"
    - "objects.githubusercontent.com"
  serviceDomains:
    api.mistral.ai: mistral
  serviceAuth:
    mistral:
      headerName: Authorization
      valueFormat: "Bearer %s"

commands:
  install:
    - command: "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
      user: "1000"
      description: Install Mistral Vibe via the official install script (installs uv then mistral-vibe)
