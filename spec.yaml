schemaVersion: "2"
kind: sandbox
name: vibe
displayName: Mistral Vibe
description: Run Mistral Vibe in Docker Sandboxes with host-side MISTRAL_API_KEY injection.
sourceURL: https://github.com/shelajev/vibe-sbx-kit
licenses:
  - Apache-2.0

sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint:
    - vibe

permissions:
  network:
    allow:
      - mistral.ai
      - "*.mistral.ai"
      - "*.mistral.services"
      - astral.sh
      - "*.astral.sh"
      - pypi.org
      - "*.pypi.org"
      - files.pythonhosted.org
      - github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com

credentials:
  - service: mistral
    description: Mistral API key for Vibe
    required: true
    apiKey:
      name: MISTRAL_API_KEY
      proxyManaged: true
      inject:
        - domain: api.mistral.ai
          scheme: bearer
        - domain: console.mistral.ai
          scheme: bearer
        - domain: chat.mistral.ai
          scheme: bearer

environment:
  variables:
    PATH: /home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

setup:
  install:
    - command: "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
      user: "1000"
      description: Install Mistral Vibe via the official install script (installs uv then mistral-vibe)
